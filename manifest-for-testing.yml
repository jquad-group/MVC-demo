applications:
  - name: ((application-name))
    health-check-type: http
    health-check-http-endpoint: /actuator
    instances: ((instances))
    memory: ((memory))
    disk_quota: 1024M
    buildpacks:
      - java_buildpack_offline
    path: ./target/refsys-aggregation-processing-service.jar

    env:
      spring.profiles.active: dev-testing
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ }, memory_calculator: { stack_threads: 25 } }'
      JBP_CONFIG_SPRING_AUTO_RECONFIGURATION: '{enabled: false}'
      JAVA_OPTS: '-XX:MaxDirectMemorySize=1024M'
      APP_LOG_LEVEL: INFO
      ACDS_CLIENT_BASEPATH: ((acds-client-basepath))
      JWT_KEYSET_URL: ((jwt-keyset-url))
      TZ: Europe/Berlin
      APPLICATION_NAME_SPLUNK: refsys-aggregation-processing-service-testing
      KMVZ_ENABLED: ((kmvz-enabled))
      CIRCUITBREAKER_ENABLED: ((circuitbreaker-enabled))
      IASD_ENABLED: true
      OTEL_DISABLED: true

    services:
      - autoscaler
      - splunk
      - mongoee-testing
      - acds-creds
      - basic-auth-admin-cred
      - grafana-creds